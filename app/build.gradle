plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.sarab.vm'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.sarab.vm'
        minSdk = 26
        targetSdk = 34
        versionCode = 6
        versionName = '1.5.0'
        // QEMU binaries are fetched for 64-bit ARM phones only (almost every phone since 2017).
        ndk {
            abiFilters.add('arm64-v8a')
        }
    }

    // One fixed key for every build, so new versions install over old ones without losing machines.
    // (The key is stored in the repository: fine for a personal app, not for publishing on a store.)
    signingConfigs {
        sarab {
            storeFile = file('sarab-release.jks')
            storePassword = 'sarabvm123'
            keyAlias = 'sarab'
            keyPassword = 'sarabvm123'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.sarab
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.sarab
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            // Android may only execute files that are extracted to the native library folder.
            useLegacyPackaging = true
            // The QEMU files are already stripped; skip the NDK strip step.
            keepDebugSymbols.add('**/*.so')
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
